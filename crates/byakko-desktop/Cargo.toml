[package]
name = "byakko-desktop"
version = "0.1.0"
edition = "2024"
publish = false
description = "Iced desktop adapter for the portable Byakko application model"

[dependencies]
byakko-core = { path = "../byakko-core" }
byakko-devices = { path = "../byakko-devices" }
# Temporary composition bridge until the reviewed Nia87 implementation moves to devices.
byakko = { path = "../..", default-features = false }
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "smol", "x11", "wayland"] }
