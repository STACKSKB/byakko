[package]
name = "byakko-cli"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Command-line client of the Byakko application contract"

[dependencies]
byakko-core = { path = "../byakko-core" }
byakko-devices = { path = "../byakko-devices" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
