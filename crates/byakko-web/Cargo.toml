[package]
name = "byakko-web"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "WebHID browser boundary for Byakko"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
byakko-core = { path = "../byakko-core" }
byakko-protocol = { path = "../byakko-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.128"
