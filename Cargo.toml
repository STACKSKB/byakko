[package]
name = "byakko"
default-run = "byakko"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native Nia87 configuration research tools"

[features]
default = ["gui"]
gui = ["dep:eframe"]
research-tools = []

[[bin]]
name = "rpc_capture"
path = "src/bin/rpc_capture.rs"
required-features = ["research-tools"]

[dependencies]
hidapi = { version = "=2.6.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["windows-native"] }
