[package]
name = "byakko"
default-run = "byakko"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native Nia87 configuration research tools"

[workspace]
members = ["crates/byakko-core", "crates/byakko-devices", "crates/byakko-desktop", "crates/byakko-cli"]
resolver = "3"

[features]
default = ["gui"]
gui = ["dep:eframe"]
research-tools = ["byakko-devices/research-tools"]

[[bin]]
name = "rpc_capture"
path = "src/bin/rpc_capture.rs"
required-features = ["research-tools"]

[[example]]
name = "verify_macro_events"
required-features = ["research-tools"]

[[example]]
name = "probe_macro_slot50"
required-features = ["research-tools"]

[[example]]
name = "capture_configuration_trace"
required-features = ["research-tools"]

[dependencies]
byakko-core = { path = "crates/byakko-core" }
byakko-devices = { path = "crates/byakko-devices" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
